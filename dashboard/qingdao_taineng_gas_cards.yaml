# =====================================================================
# 青岛泰能燃气 · Home Assistant 仪表盘卡片（示例，可直接复制粘贴）
# ---------------------------------------------------------------------
# 【需要安装的 HACS 前端卡片】
#   - mushroom           → custom:mushroom-template-card / custom:mushroom-title-card
#   - apexcharts-card    → custom:apexcharts-card
#   - card-mod           → 所有卡片的配色 / 去边框样式
#   mini-graph-card、button-card 本方案未用到，可以不装。
#   ⚠️ 本示例刻意**不使用** stack-in-card，容器改用 HA 内置的 vertical-stack / grid，
#      因此不需要额外安装 stack-in-card。
#
# 【使用前请替换实体 ID】
#   传感器实体前缀 = 「泰能燃气 <表号末4位>」这个设备名。示例统一用 ty_1234 作占位。
#   打开「开发者工具 → 状态」，搜索“用气 / 燃气 / 泰能”，把 ty_1234 换成你实际的前缀。
#   本卡片用到的 5 个实体（全部由本集成生成，无需另建模板传感器）：
#     ① sensor.ty_1234_shang_ge_zhang_qi_lei_ji_biao_du_shu  上个账期累计表读数
#     ② sensor.ty_1234_zui_jin_yi_ri_yong_liang             最近一日用量（属性 recent_days = 最近 14 天）
#     ③ sensor.ty_1234_ben_zhang_qi_lei_ji_yong_liang       本账期累计用量
#     ④ sensor.ty_1234_dang_nian_lei_ji_yong_liang          当年累计用量（属性 monthly = 当年逐月已出账）
#     ⑤ sensor.ty_1234_ran_qi_fei_dan_jia                   燃气费单价（属性 tier_remaining = 三档剩余气量）
#
# 【数据口径提示】
#   - 燃气数据滞后 1 天，“最新”实为昨天；
#   - 泰能按账期（抄表日→下一抄表日）计费，非自然月；本卡同时给出“本账期”与“自然月”两个口径；
#   - 月度趋势图来自接口 type=year 的逐月汇总，只显示当年已出账月份。
# =====================================================================
type: vertical-stack
cards:
  # ---------- 标题栏：设备 / 户号 + 数据截至日期 ----------
  - type: custom:mushroom-template-card
    primary: 泰能燃气 · 用气监控
    secondary: >-
      {{ state_attr('sensor.ty_1234_shang_ge_zhang_qi_lei_ji_biao_du_shu','user_no') or '' }} ·
      数据截至 {{ state_attr('sensor.ty_1234_zui_jin_yi_ri_yong_liang','reading_date') or '—' }}（滞后 {{
      state_attr('sensor.ty_1234_zui_jin_yi_ri_yong_liang','data_lag_days') or 1 }} 天）
    icon: mdi:fire
    icon_color: '#88c0d0'
    multiline_secondary: true
    tap_action:
      action: none
    card_mod:
      style: >
        ha-card { background: none !important; box-shadow: none !important; border: none
        !important; color: #d8dee9; padding: 0 2px 10px !important; }
        mushroom-shape-icon { --shape-color: rgba(136,192,208,0.12) !important; }
        :host { --card-primary-font-size: 19px; --card-primary-font-weight: 760;
        --card-secondary-font-size: 12px; }

  # ---------- 主卡片第一行：累计表读数 + 最近一日用量（大号数值） ----------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.ty_1234_shang_ge_zhang_qi_lei_ji_biao_du_shu
        # 累计表读数：官方抄表口径，保留 1 位小数；★如需 2 位小数把 round(1) 改成 round(2)
        primary: >-
          {{ states('sensor.ty_1234_shang_ge_zhang_qi_lei_ji_biao_du_shu') | float(0) | round(1) }} m³
        secondary: >-
          累计表读数 · {{ state_attr('sensor.ty_1234_shang_ge_zhang_qi_lei_ji_biao_du_shu','meter_reading_date')
          or '—' }} 抄表
        icon: mdi:counter
        icon_color: '#88c0d0'
        tap_action:
          action: more-info
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: left; }
            :host { --card-primary-font-size: 32px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 12px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
      - type: custom:mushroom-template-card
        entity: sensor.ty_1234_zui_jin_yi_ri_yong_liang
        # 最近一日用量：滞后 1 天，实为“昨天”的已结算量
        primary: >-
          {{ states('sensor.ty_1234_zui_jin_yi_ri_yong_liang') | float(0) | round(1) }} m³
        secondary: >-
          最近一日 · {{ state_attr('sensor.ty_1234_zui_jin_yi_ri_yong_liang','reading_date') or '—' }}
        icon: mdi:fire
        icon_color: '#81a1c1'
        tap_action:
          action: more-info
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: left; }
            :host { --card-primary-font-size: 32px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 12px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
    card_mod:
      style: |
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 0 !important; }

  # ---------- 账期口径小注（非自然月，和账单月份不对齐是正常的） ----------
  - type: markdown
    content: >-
      <div class='bill-note'>账期 · {{ state_attr('sensor.ty_1234_ben_zhang_qi_lei_ji_yong_liang','cycle_start')
      or '—' }} → {{ state_attr('sensor.ty_1234_ben_zhang_qi_lei_ji_yong_liang','cycle_end') or '—' }}
      （非自然月，抄表日结算）</div>
    card_mod:
      style: |
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 0 2px 6px !important; }
        ha-markdown { padding: 0 !important; }
        .bill-note { color: #8792a6; font-size: 12px; letter-spacing: .02em; }

  # ---------- 主卡片第二行：燃气费单价（替代电费卡的“日均电费”）+ 当年累计用量 ----------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.ty_1234_ran_qi_fei_dan_jia
        # 燃气费单价 = 下一 m³ 将适用的阶梯价（3.54 / 4.12 / 4.99 元/m³）
        primary: >-
          {{ states('sensor.ty_1234_ran_qi_fei_dan_jia') | float(0) | round(2) }} 元/m³
        secondary: >-
          燃气费单价 · {{ state_attr('sensor.ty_1234_ran_qi_fei_dan_jia','tier_name') or '—' }}
        icon: mdi:cash-multiple
        icon_color: '#ebcb8b'
        tap_action:
          action: more-info
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: left; }
            :host { --card-primary-font-size: 19px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 11px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
      - type: custom:mushroom-template-card
        entity: sensor.ty_1234_dang_nian_lei_ji_yong_liang
        primary: >-
          {{ states('sensor.ty_1234_dang_nian_lei_ji_yong_liang') | float(0) | round(1) }} m³
        secondary: >-
          当年累计 · {{ state_attr('sensor.ty_1234_dang_nian_lei_ji_yong_liang','annual_cycle_end') or '2026-12-31' }}
        icon: mdi:chart-timeline-variant
        icon_color: '#8fbcbb'
        tap_action:
          action: more-info
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: left; }
            :host { --card-primary-font-size: 19px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 11px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
    card_mod:
      style: |
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 0 0 4px !important; }

  # ---------- 信息卡：本月累计 / 日均 / 数据日期 / 本账期累计 ----------
  - type: custom:mushroom-title-card
    title: 用量概览
    subtitle: 本月为自然月口径；账期见上方小注
    card_mod:
      style: >
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 10px 2px 4px !important; }
        .title { color: #88c0d0 !important; font-size: 13px !important; font-weight: 760
        !important; letter-spacing: .06em; text-transform: uppercase; }
        .subtitle { color: #8792a6 !important; font-size: 12px !important; }
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        # 本月累计：从「当年累计用量」的 monthly 属性里取当前自然月，求和
        primary: >-
          {% set m = now().strftime('%Y-%m') %}{% set r =
          state_attr('sensor.ty_1234_dang_nian_lei_ji_yong_liang','monthly') or [] %}{{ (r |
          selectattr('month','eq',m) | map(attribute='volume') | map('float',0) | sum) | round(1) }} m³
        secondary: 本月累计 · 自然月
        icon: mdi:calendar-month
        icon_color: '#88c0d0'
        tap_action:
          action: none
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: left; }
            :host { --card-primary-font-size: 26px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 12px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
      - type: custom:mushroom-template-card
        # 日均：最近 14 天（recent_days 属性）的平均值
        primary: >-
          {% set r = state_attr('sensor.ty_1234_zui_jin_yi_ri_yong_liang','recent_days') or [] %}{{
          (((r | map(attribute='volume') | map('float',0) | sum) / (r | length)) | round(2)) if (r |
          length) else 0 }} m³
        secondary: 日均 · 近 {{ state_attr('sensor.ty_1234_zui_jin_yi_ri_yong_liang','recent_days') |
          length }} 天
        icon: mdi:chart-bell-curve-cumulative
        icon_color: '#8fbcbb'
        tap_action:
          action: none
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: left; }
            :host { --card-primary-font-size: 26px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 12px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
    card_mod:
      style: |
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 0 !important; }

  # ---------- 信息卡第二行：本账期累计用量 + 数据日期 ----------
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.ty_1234_ben_zhang_qi_lei_ji_yong_liang
        primary: >-
          {{ states('sensor.ty_1234_ben_zhang_qi_lei_ji_yong_liang') | float(0) | round(1) }} m³
        secondary: 本账期累计
        icon: mdi:calendar-sync
        icon_color: '#81a1c1'
        tap_action:
          action: more-info
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: left; }
            :host { --card-primary-font-size: 19px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 11px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
      - type: custom:mushroom-template-card
        primary: >-
          {{ state_attr('sensor.ty_1234_zui_jin_yi_ri_yong_liang','reading_date') or '—' }}
        secondary: 数据日期 · 滞后 {{ state_attr('sensor.ty_1234_zui_jin_yi_ri_yong_liang','data_lag_days')
          or 1 }} 天
        icon: mdi:calendar-clock
        icon_color: '#8792a6'
        tap_action:
          action: none
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: left; }
            :host { --card-primary-font-size: 19px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 11px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
    card_mod:
      style: |
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 0 0 4px !important; }

  # ---------- 阶梯气价剩余量（替代电费卡的“阶梯电价档位”） ----------
  # tier_remaining 属性 = 接口 cycSurplus，格式 [一档剩余, 二档剩余, 三档剩余]；
  # 三档是“无限量”，接口常返回 99999999 之类的哨兵值，这里显示成“无限”。
  - type: markdown
    content: >-
      <div class='tou-note'>阶梯气价剩余（户·年累计，每年 1 月 1 日清零）</div>
    card_mod:
      style: |
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 8px 2px 0 !important; }
        ha-markdown { padding: 0 !important; }
        .tou-note { color: #8792a6; font-size: 12px; letter-spacing: .02em; }
  - type: grid
    columns: 3
    square: false
    cards:
      # ★三张卡只有 {% set i = 0 / 1 / 2 %} 和标题不同，其余一致
      - type: custom:mushroom-template-card
        primary: >-
          {% set r = state_attr('sensor.ty_1234_ran_qi_fei_dan_jia','tier_remaining') or [] %}{% set v
          = (r[0] if r | length > 0 else 0) %}{{ '无限' if v > 1000000 else (v | float(0) | round(1) ~
          ' m³') }}
        secondary: 一档剩余 · 3.54 元/m³
        icon: mdi:numeric-1-circle-outline
        icon_color: '#8fbcbb'
        tap_action:
          action: more-info
        entity: sensor.ty_1234_ran_qi_fei_dan_jia
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: center; }
            :host { --card-primary-font-size: 18px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 10px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
      - type: custom:mushroom-template-card
        primary: >-
          {% set r = state_attr('sensor.ty_1234_ran_qi_fei_dan_jia','tier_remaining') or [] %}{% set v
          = (r[1] if r | length > 1 else 0) %}{{ '无限' if v > 1000000 else (v | float(0) | round(1) ~
          ' m³') }}
        secondary: 二档剩余 · 4.12 元/m³
        icon: mdi:numeric-2-circle-outline
        icon_color: '#81a1c1'
        tap_action:
          action: more-info
        entity: sensor.ty_1234_ran_qi_fei_dan_jia
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: center; }
            :host { --card-primary-font-size: 18px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 10px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
      - type: custom:mushroom-template-card
        primary: >-
          {% set r = state_attr('sensor.ty_1234_ran_qi_fei_dan_jia','tier_remaining') or [] %}{% set v
          = (r[2] if r | length > 2 else 0) %}{{ '无限' if v > 1000000 else (v | float(0) | round(1) ~
          ' m³') }}
        secondary: 三档剩余 · 4.99 元/m³
        icon: mdi:numeric-3-circle-outline
        icon_color: '#ebcb8b'
        tap_action:
          action: more-info
        entity: sensor.ty_1234_ran_qi_fei_dan_jia
        card_mod:
          style: >
            ha-card { background: none !important; box-shadow: none !important; border: none
            !important; color: #d8dee9; padding: 4px 0 !important; text-align: center; }
            :host { --card-primary-font-size: 18px; --card-primary-font-weight: 780;
            --card-secondary-font-size: 10px; --card-secondary-font-weight: 560;
            --primary-text-color: #d8dee9; --secondary-text-color: #8792a6; }
            mushroom-shape-icon { --shape-color: rgba(136,192,208,0.10) !important; }
    card_mod:
      style: |
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 0 0 4px !important; }

  # ---------- 趋势卡片 1：最近 14 天用气量（柱状图，数据取自 recent_days 属性） ----------
  - type: custom:mushroom-title-card
    title: 最近 14 天用气量
    subtitle: 逐日已结算用量
    card_mod:
      style: >
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 10px 2px 4px !important; }
        .title { color: #88c0d0 !important; font-size: 13px !important; font-weight: 760
        !important; letter-spacing: .06em; text-transform: uppercase; }
        .subtitle { color: #8792a6 !important; font-size: 12px !important; }
  - type: custom:apexcharts-card
    header:
      show: true
      title: 日用量 (m³)
      show_states: false
    apex_config:
      chart:
        height: 150
        background: transparent
        fontFamily: inherit
        toolbar:
          show: false
        parentHeightOffset: 0
      theme:
        mode: dark
      grid:
        borderColor: rgba(143,188,187,0.10)
        strokeDashArray: 4
      legend:
        show: false
      tooltip:
        theme: dark
        x:
          format: yy年M月d日
      dataLabels:
        enabled: false
      yaxis:
        decimalsInFloat: 1
        labels:
          style:
            colors: '#8792a6'
      xaxis:
        tooltip:
          enabled: false
        labels:
          style:
            colors: '#8792a6'
      plotOptions:
        bar:
          columnWidth: 58%
          borderRadius: 4
    series:
      # data_generator 直接读「最近一日用量」实体的 recent_days 属性（14 天）
      - entity: sensor.ty_1234_zui_jin_yi_ri_yong_liang
        name: 日用量
        type: column
        unit: ' m³'
        color: '#88c0d0'
        data_generator: >-
          const r=entity.attributes.recent_days||[];return
          r.map(x=>[new Date(x.date).getTime(),Number(x.volume||0)]).sort((a,b)=>a[0]-b[0]);
        extend_to: false
    card_mod:
      style: |
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 0 !important; }
        .apexcharts-tooltip, .apexcharts-tooltip.apexcharts-theme-light,
        .apexcharts-tooltip.apexcharts-theme-dark {
          background: rgba(8,14,28,0.92) !important; border: 1px solid rgba(136,192,208,0.25) !important;
          color: #d8dee9 !important; border-radius: 12px !important; }
        .apexcharts-tooltip-title { background: rgba(14,22,42,0.95) !important;
        border-bottom: 1px solid rgba(136,192,208,0.18) !important; color: #88c0d0 !important; }
        .apexcharts-xaxistooltip { display: none !important; }

  # ---------- 趋势卡片 2：当年已出账单各月用量（柱状图，数据取自 monthly 属性） ----------
  - type: custom:mushroom-title-card
    title: 月度用气趋势
    subtitle: 当年已出账月份
    card_mod:
      style: >
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 10px 2px 4px !important; }
        .title { color: #88c0d0 !important; font-size: 13px !important; font-weight: 760
        !important; letter-spacing: .06em; text-transform: uppercase; }
        .subtitle { color: #8792a6 !important; font-size: 12px !important; }
  - type: custom:apexcharts-card
    header:
      show: true
      title: 月用量 (m³)
      show_states: false
    apex_config:
      chart:
        height: 140
        background: transparent
        fontFamily: inherit
        toolbar:
          show: false
        parentHeightOffset: 0
      theme:
        mode: dark
      grid:
        borderColor: rgba(143,188,187,0.10)
        strokeDashArray: 4
      legend:
        show: false
      tooltip:
        theme: dark
        x:
          format: yyyy年M月
      dataLabels:
        enabled: false
      yaxis:
        decimalsInFloat: 0
        labels:
          style:
            colors: '#8792a6'
      xaxis:
        tooltip:
          enabled: false
        labels:
          style:
            colors: '#8792a6'
      plotOptions:
        bar:
          columnWidth: 42%
          borderRadius: 5
    series:
      # data_generator 读「当年累计用量」实体的 monthly 属性（year 接口逐月汇总）
      - entity: sensor.ty_1234_dang_nian_lei_ji_yong_liang
        name: 月用量
        type: column
        unit: ' m³'
        color: '#81a1c1'
        data_generator: >-
          const r=entity.attributes.monthly||[];return r.filter(x=>x.month).map(x=>[new
          Date(x.month+'-01').getTime(),Number(x.volume||0)]).sort((a,b)=>a[0]-b[0]);
        extend_to: false
    card_mod:
      style: |
        ha-card { background: none !important; box-shadow: none !important; border: none !important;
        color: #d8dee9; padding: 0 !important; }
        .apexcharts-tooltip, .apexcharts-tooltip.apexcharts-theme-light,
        .apexcharts-tooltip.apexcharts-theme-dark {
          background: rgba(8,14,28,0.92) !important; border: 1px solid rgba(136,192,208,0.25) !important;
          color: #d8dee9 !important; border-radius: 12px !important; }
        .apexcharts-tooltip-title { background: rgba(14,22,42,0.95) !important;
        border-bottom: 1px solid rgba(136,192,208,0.18) !important; color: #88c0d0 !important; }
        .apexcharts-xaxistooltip { display: none !important; }

# =====================================================================
# 外层容器样式（Nord 深色玻璃拟态）。若整卡嵌进已有 dashboard，可整段删掉，
# 或把 width 改成 100% 让它自动铺满。
# =====================================================================
card_mod:
  style: |
    ha-card {
      width: min(100%, 600px);
      margin: 0 auto;
      padding: 18px 18px 14px;
      color: #d8dee9;
      background:
        radial-gradient(circle at 18% 0%, rgba(136,192,208,0.14), transparent 35%),
        radial-gradient(circle at 100% 16%, rgba(180,142,173,0.10), transparent 30%),
        linear-gradient(145deg, rgba(12,19,35,0.85), rgba(6,10,20,0.85));
      backdrop-filter: blur(24px) saturate(1.35);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
      border: 1px solid rgba(216,222,233,0.16);
      border-radius: 28px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.38), inset 0 1px 0 rgba(236,239,244,0.11);
      overflow: hidden;
    }
    @media (max-width: 520px) {
      ha-card { margin: 0 auto; padding: 14px 12px 10px; border-radius: 24px; }
    }
